# Публичная безопасная заглушка для современных ASUSWRT-роутеров.
# В ней нет подписок, UUID, серверов и других приватных данных.
# После установки замени файл своим настоящим конфигом и выполни:
#   goshacrash apply

external-controller: 0.0.0.0:9090
secret: "CHANGE_ME"
external-ui: ui
external-ui-url: "https://github.com/Zephyruso/zashboard/releases/latest/download/dist-no-fonts.zip"

profile:
  store-selected: true
  store-fake-ip: true

mixed-port: 7892
allow-lan: true
bind-address: "*"
mode: rule
log-level: info
ipv6: false

# Минимальный DNS, необходимый для запуска и проверки установки.
dns:
  enable: true
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  default-nameserver:
    - 1.1.1.1
    - 8.8.8.8
  nameserver:
    - 1.1.1.1
    - 8.8.8.8

# Modern-профиль: маршруты создаёт сам Mihomo.
tun:
  enable: true
  stack: system
  device: tun0
  dns-hijack:
    - any:53
    - tcp://any:53
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# Заглушка не включает VPN: весь трафик идёт напрямую.
rules:
  - MATCH,DIRECT
